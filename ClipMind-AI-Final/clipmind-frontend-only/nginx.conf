server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # React Router (BrowserRouter) ke liye: koi bhi route match na ho
    # (jaise /history, /quiz/123) to bhi index.html hi serve karo,
    # warna seedhe URL kholne/refresh karne par 404 aayega.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
